<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hadza - An interactive visual experience with cursor-following effects and ambient design">
  <meta name="author" content="Isaac Osuna">
  <meta name="theme-color" content="#000000">

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hadza">
  <meta property="og:description" content="An interactive visual experience with cursor-following effects">
  <meta property="og:image" content="/og-image.png">

  <title>Hadza</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Preconnect to Google Fonts for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Cursor follow blob and background blur -->
  <div id="blob" aria-hidden="true"></div>
  <div id="blur" aria-hidden="true"></div>

  <!-- Main Content -->
  <main id="home" class="home-container">
    <div class="white-block" aria-hidden="true"></div>
    <div class="black-block" aria-hidden="true"></div>

    <div class="content-center">
      <section class="hero-section">
        <h1 class="text-mono gradient-text" role="banner">hADzA</h1>
      </section>
    </div>
  </main>

  <!-- Audio Control -->
  <button id="audio-toggle" class="audio-control" aria-label="Toggle audio" title="Toggle audio">
    <span class="audio-icon">🔇</span>
  </button>

  <!-- Footer -->
  <footer>
    <p id="credits" class="text-mono gradient-text">by: isaac osuna</p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
